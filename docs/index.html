    <header>
      <h1>onefold — A Modern Reactive UI Framework for TypeScript</h1>
      <p>Everything you need to build web applications — in one framework, one import, 3kb gzipped, with zero dependencies.</p>
    </header>

    <main>
      <section>
        <h2>Why developers choose onefold</h2>
        <p>onefold gives you a complete set of tools for building modern web applications without needing to install or configure dozens of separate libraries. Signals keep your UI in sync automatically. Routing, forms, state, and data fetching are all included and work together out of the box.</p>
      </section>

      <section>
        <h2>What is included</h2>
        <ul>
          <li><strong>Signals</strong> — Reactive primitives that update only the exact part of the page that changed. Fast and precise.</li>
          <li><strong>Templates</strong> — Write your UI with familiar HTML syntax using tagged template literals. No special syntax to learn.</li>
          <li><strong>Routing</strong> — Navigate between pages without reloading. Supports nested routes, dynamic segments, and hash or path modes.</li>
          <li><strong>State Management</strong> — A reactive store for shared state, with support for persisting data across sessions.</li>
          <li><strong>Forms</strong> — Create and validate forms with simple, declarative rules.</li>
          <li><strong>HTTP Client</strong> — Make API requests with built-in support for interceptors, retries, and typed responses.</li>
          <li><strong>Internationalization</strong> — Support multiple languages with reactive locale switching.</li>
          <li><strong>Theming</strong> — Switch themes using CSS variables, reactively.</li>
          <li><strong>Server-Side Rendering</strong> — Render pages to HTML on the server for fast initial loads and better search visibility.</li>
          <li><strong>Microfrontends</strong> — Load remote modules securely at runtime with origin checking, integrity verification, and isolation.</li>
          <li><strong>Accessibility</strong> — Built-in focus traps, screen reader announcements, keyboard shortcuts, and skip links.</li>
          <li><strong>Scoped CSS</strong> — Keep component styles contained without affecting the rest of your application.</li>
        </ul>
      </section>

      <section>
        <h2>How it works</h2>
        <p>onefold uses fine-grained signals for reactivity. When a value changes, only the specific part of the page that depends on it updates — nothing else re-renders. There is no virtual DOM and no diffing step. This makes updates fast and predictable.</p>
        <p>Components are plain TypeScript functions that return DOM nodes. There are no classes, decorators, or special syntax. If you know HTML and JavaScript, you can start building with onefold right away.</p>
      </section>

      <section>
        <h2>Get started</h2>
        <p>Create a new project:</p>
        <p><code>npm create onefold@latest my-app</code></p>
        <p>Or add to an existing project:</p>
        <p><code>npm install onefold</code></p>
      </section>

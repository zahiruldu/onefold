<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hero App — onefold</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #6366f1;
      --good: #22c55e;
      --bad: #ef4444;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .hero-app { max-width: 1000px; margin: 0 auto; padding: 32px 20px; }
    .hero-header { text-align: center; margin-bottom: 32px; }
    .hero-header h1 { font-size: 32px; margin-bottom: 8px; }
    .hero-header p { color: var(--muted); font-size: 14px; }

    /* Search */
    .search-box { margin-bottom: 24px; }
    .search-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: var(--accent); }

    /* Hero grid */
    .hero-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .hero-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }
    .hero-card:hover { transform: translateY(-3px); border-color: var(--accent); }
    .hero-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }
    .hero-info { padding: 12px 14px; }
    .hero-name { font-size: 16px; margin-bottom: 2px; }
    .hero-fullname { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .hero-publisher { font-size: 11px; color: var(--muted); margin-left: 6px; }

    /* Badges */
    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 600;
      text-transform: capitalize;
    }
    .badge-good { background: rgba(34,197,94,0.15); color: var(--good); }
    .badge-bad { background: rgba(239,68,68,0.15); color: var(--bad); }
    .badge-neutral { background: rgba(148,163,184,0.15); color: var(--muted); }

    /* Hero detail */
    .hero-detail { background: var(--surface); border-radius: var(--radius); padding: 24px; }
    .hero-detail-header { display: flex; gap: 20px; align-items: center; margin-bottom: 24px; }
    .hero-detail-img { width: 160px; height: 160px; object-fit: cover; border-radius: var(--radius); }
    .hero-detail h2 { margin-bottom: 4px; }
    .hero-meta { color: var(--muted); font-size: 13px; margin-top: 6px; }

    /* Stat bars */
    .stats-grid { display: grid; gap: 10px; margin-top: 12px; }
    .stat-bar { display: flex; align-items: center; gap: 10px; }
    .stat-label { width: 100px; font-size: 13px; color: var(--muted); }
    .stat-track {
      flex: 1;
      height: 8px;
      background: var(--bg);
      border-radius: 4px;
      overflow: hidden;
    }
    .stat-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
    .stat-value { width: 30px; font-size: 13px; text-align: right; font-weight: 600; }

    /* Buttons */
    .btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn:hover { border-color: var(--accent); }
    .btn-back { margin-bottom: 20px; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }

    /* Spinner */
    .spinner { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 48px; color: var(--muted); }
    .spinner-ring {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error */
    .error-box {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
    }
    .error-icon { font-size: 24px; }
    .error-box p { margin: 8px 0; color: var(--muted); }

    .no-results { text-align: center; color: var(--muted); padding: 32px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./dist/hero-app.js"></script>
</body>
</html>
